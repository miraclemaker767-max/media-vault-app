<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#09090d">
  <title>VIP Content Vault</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
  <style>
    :root {
      color-scheme: dark;
      --bg: #09090d;
      --panel: #111118;
      --panel-2: #171720;
      --line: rgba(255,255,255,.09);
      --text: #f6f4f0;
      --muted: #a5a3b2;
      --gold: #e7c477;
      --gold-2: #b88b3b;
      --radius: 18px;
    }
    * { box-sizing: border-box; }
    html { min-height: 100%; background: var(--bg); }
    body {
      margin: 0; min-height: 100vh; color: var(--text);
      background:
        radial-gradient(ellipse at 50% -15%, rgba(183,139,59,.14), transparent 42%),
        var(--bg);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    button, input { font: inherit; }
    button { -webkit-tap-highlight-color: transparent; }
    .app { width: min(100%, 980px); margin: 0 auto; padding: max(18px, env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom)); }
    .topbar { display:flex; align-items:center; justify-content:space-between; gap:12px; padding: 4px 0 20px; }
    .brand { display:flex; align-items:center; gap:11px; min-width:0; }
    .brand-mark {
      width: 42px; height:42px; flex:0 0 auto; display:grid; place-items:center;
      border:1px solid rgba(231,196,119,.42); border-radius:14px;
      background: linear-gradient(145deg, #2b2418, #111015 72%);
      color:var(--gold); font-size:20px; box-shadow:0 6px 24px #0006;
    }
    .brand-name { margin:0; font-size:14px; line-height:1.15; font-weight:850; letter-spacing:.12em; }
    .brand-caption { margin:5px 0 0; font-size:10px; color:var(--muted); letter-spacing:.16em; text-transform:uppercase; }
    .vip-btn { border:1px solid rgba(231,196,119,.5); color:var(--gold); background:#211b12; border-radius:999px; padding:10px 13px; font-size:11px; font-weight:800; white-space:nowrap; }
    .hero {
      position:relative; overflow:hidden; padding:23px 20px; border:1px solid rgba(231,196,119,.2);
      border-radius:22px; background:linear-gradient(115deg, rgba(49,39,24,.95), rgba(20,19,25,.96) 60%, #121117);
      margin-bottom:20px; box-shadow:0 14px 40px #0003;
    }
    .hero:after { content:""; position:absolute; width:180px; height:180px; border:1px solid #e7c47718; border-radius:50%; right:-48px; top:-76px; box-shadow:0 0 0 22px #e7c47708, 0 0 0 44px #e7c47705; pointer-events:none; }
    .eyebrow { display:flex; align-items:center; gap:8px; color:var(--gold); font-size:10px; font-weight:800; letter-spacing:.18em; text-transform:uppercase; }
    .eyebrow:before { content:""; width:18px; height:1px; background:var(--gold); }
    .hero h2 { margin:12px 0 8px; max-width:500px; font-size:clamp(24px, 5vw, 34px); line-height:1.08; letter-spacing:-.04em; }
    .hero p { margin:0; max-width:440px; color:#c0bdc8; font-size:12px; line-height:1.65; }
    .hero-foot { display:flex; align-items:center; gap:8px; margin-top:18px; font-size:10px; color:#e2d5b6; }
    .live-dot { width:7px; height:7px; background:#8fd4a5; border-radius:50%; box-shadow:0 0 10px #8fd4a577; }
    .toolbar { display:flex; gap:10px; margin:0 0 20px; }
    .search-wrap { position:relative; flex:1; min-width:0; }
    .search-icon { position:absolute; top:50%; left:14px; transform:translateY(-50%); color:#8d8999; pointer-events:none; font-size:16px; }
    .search { width:100%; height:46px; padding:0 14px 0 40px; border:1px solid var(--line); border-radius:14px; outline:none; color:var(--text); background:#13131a; font-size:13px; }
    .search:focus { border-color:#b88b3b99; box-shadow:0 0 0 3px #b88b3b18; }
    .refresh-btn { width:46px; flex:0 0 46px; border:1px solid var(--line); border-radius:14px; background:#13131a; color:#e9e4d9; font-size:18px; }
    .section-head { display:flex; align-items:end; justify-content:space-between; gap:10px; margin:0 2px 13px; }
    .section-head h3 { margin:0; font-size:16px; letter-spacing:-.02em; }
    .section-head p { margin:5px 0 0; font-size:11px; color:var(--muted); }
    .count { color:var(--gold); background:#e7c47714; border:1px solid #e7c47725; padding:5px 8px; border-radius:999px; font-size:10px; font-weight:750; white-space:nowrap; }
    .grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; }
    .card { min-width:0; overflow:hidden; border:1px solid var(--line); border-radius:16px; background:linear-gradient(180deg,#17171f,#111117); box-shadow:0 8px 22px #0002; transition:transform .18s ease,border-color .18s ease; }
    .card:active { transform:scale(.985); }
    .thumb-wrap { position:relative; aspect-ratio: 4 / 3; overflow:hidden; background:linear-gradient(135deg,#24232b,#14141a); }
    .thumb { width:100%; height:100%; display:block; object-fit:cover; }
    .thumb-placeholder { position:absolute; inset:0; display:grid; place-items:center; color:#a99a7a; font-size:30px; background:radial-gradient(circle at 50% 35%,#39302a,#15151c 65%); }
    .thumb-badge { position:absolute; left:9px; top:9px; padding:5px 7px; border:1px solid #ffffff22; border-radius:7px; background:#09090dc9; color:#f4e5c4; font-size:9px; font-weight:800; letter-spacing:.08em; backdrop-filter:blur(8px); }
    .play-indicator { position:absolute; right:9px; bottom:9px; display:grid; place-items:center; width:32px; height:32px; border:1px solid #ffffff38; border-radius:50%; color:white; background:#09090dbb; backdrop-filter:blur(8px); }
    .card-body { padding:11px; }
    .card-title { margin:0 0 11px; min-height:34px; font-size:12px; font-weight:700; line-height:1.4; color:#f1eff5; overflow-wrap:anywhere; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
    .watch-btn { width:100%; min-height:38px; border:1px solid #e7c47755; border-radius:10px; background:linear-gradient(135deg,#e7c477,#b98b3e); color:#19140c; font-size:11px; font-weight:900; letter-spacing:.035em; cursor:pointer; }
    .watch-btn:active, .vip-btn:active, .refresh-btn:active { transform:scale(.98); }
    .state { grid-column:1/-1; text-align:center; padding:38px 18px; border:1px dashed #ffffff1b; border-radius:16px; background:#111117aa; }
    .state-icon { font-size:27px; margin-bottom:10px; }
    .state h4 { margin:0 0 7px; font-size:14px; }
    .state p { margin:0 auto 15px; max-width:280px; color:var(--muted); font-size:12px; line-height:1.6; }
    .state-btn { padding:10px 15px; border:1px solid #e7c47755; border-radius:10px; background:#211b12; color:var(--gold); font-size:11px; font-weight:800; }
    .footer { text-align:center; padding:24px 8px 4px; color:#6e6b78; font-size:10px; line-height:1.7; }
    
    /* Modals */
    .modal-backdrop { position:fixed; inset:0; z-index:10; display:none; align-items:center; justify-content:center; padding:20px; background:#000b; backdrop-filter:blur(8px); }
    .modal-backdrop.open { display:flex; }
    .modal { width:min(100%,360px); padding:23px; border:1px solid #e7c47744; border-radius:20px; background:#15141a; box-shadow:0 24px 80px #0008; }
    .modal h3 { margin:0 0 9px; font-size:19px; }
    .modal p { margin:0 0 18px; color:var(--muted); font-size:12px; line-height:1.7; }
    .modal-close { width:100%; padding:12px; border:0; border-radius:11px; background:var(--gold); color:#19140c; font-weight:850; cursor:pointer; }

    /* In-App Video Player Overlay */
    .player-modal-backdrop { position:fixed; inset:0; z-index:99; display:none; flex-direction:column; align-items:center; justify-content:center; padding:16px; background:rgba(0,0,0,0.92); backdrop-filter:blur(12px); }
    .player-modal-backdrop.open { display:flex; }
    .player-container { width:min(100%, 800px); background:#111118; border:1px solid var(--gold-2); border-radius:16px; overflow:hidden; display:flex; flex-direction:column; box-shadow:0 10px 40px #000; }
    .player-header { display:flex; justify-content:space-between; align-items:center; padding:12px 16px; background:#171720; border-bottom:1px solid var(--line); }
    .player-title { font-size:13px; font-weight:700; color:#fff; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; margin-right:10px; }
    .player-close-btn { background:var(--gold); border:none; color:#111; font-weight:800; padding:6px 14px; border-radius:8px; cursor:pointer; font-size:12px; }
    .player-body { width:100%; aspect-ratio:16/9; background:#000; display:flex; align-items:center; justify-content:center; }
    .player-body iframe, .player-body video { width:100%; height:100%; border:none; }

    @media (min-width:620px) { .app { padding-left:24px; padding-right:24px; } .grid { grid-template-columns:repeat(3,minmax(0,1fr)); gap:15px; } .thumb-wrap { aspect-ratio:16/10; } .card-title { font-size:13px; min-height:37px; } .card-body { padding:13px; } }
    @media (min-width:850px) { .grid { grid-template-columns:repeat(4,minmax(0,1fr)); } }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">V</div>
        <div>
          <h1 class="brand-name">VIP CONTENT VAULT</h1>
          <p class="brand-caption">Curated video collection</p>
        </div>
      </div>
      <button class="vip-btn" id="vipButton" type="button">♛ &nbsp; VIP ACCESS</button>
    </header>

    <section class="hero" aria-labelledby="heroTitle">
      <div class="eyebrow">The premium collection</div>
      <h2 id="heroTitle">Your next watch
