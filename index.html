<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIP Content Vault</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
    <style>
        :root {
            --bg-dark: #08090d;
            --card-bg: #11131a;
            --gold-accent: #eab308;
            --silver-gradient: linear-gradient(180deg, #ffffff 0%, #cbd5e1 50%, #64748b 100%);
        }

        body { 
            background-color: var(--bg-dark); 
            color: #e2e8f0; 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
            padding: 12px; 
            margin: 0; 
            box-sizing: border-box;
        }

        /* Top Bar: Title + Pill Button */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        /* Metallic Silver Header Title (including stars) */
        .header-title {
            font-size: 15px;
            font-weight: 900;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            background: var(--silver-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0;
            filter: drop-shadow(0 2px 4px rgba(255, 255, 255, 0.15));
        }

        /* Top Right VIP Pill Button (Copied exactly) */
        .vip-pill-btn {
            background: #111009;
            border: 1px solid var(--gold-accent);
            color: var(--gold-accent);
            font-size: 10px;
            font-weight: 700;
            padding: 5px 12px;
            border-radius: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
            box-shadow: 0 0 6px rgba(234, 179, 8, 0.2);
            transition: transform 0.2s;
        }
        .vip-pill-btn:active {
            transform: scale(0.95);
        }

        /* Full Zero Ads Experience Card (Copied exactly from reference) */
        .zero-ads-card {
            background: #111218;
            border: 1px solid rgba(234, 179, 8, 0.4);
            border-radius: 12px;
            padding: 10px 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
            transition: border-color 0.2s, transform 0.2s;
        }
        .zero-ads-card:active {
            transform: scale(0.98);
            border-color: var(--gold-accent);
        }

        .zero-ads-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Golden Lightning Icon Box */
        .icon-box {
            background: rgba(234, 179, 8, 0.15);
            border: 1px solid rgba(234, 179, 8, 0.3);
            border-radius: 8px;
            width: 34px;
            height: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--gold-accent);
            font-size: 16px;
            font-weight: bold;
        }

        .zero-ads-text {
            display: flex;
            flex-direction: column;
        }
        .zero-ads-title {
            font-size: 12px;
            font-weight: 800;
            color: var(--gold-accent);
        }
        .zero-ads-sub {
            font-size: 10px;
            color: #94a3b8;
            margin-top: 1px;
        }

        .zero-ads-arrow {
            color: var(--gold-accent);
            font-size: 14px;
            font-weight: bold;
        }

        /* 3-Column Grid */
        .grid { 
            display: grid; 
            grid-template-columns: repeat(3, 1fr); 
            gap: 8px; 
        }

        .card { 
            background: var(--card-bg); 
            border-radius: 8px; 
            overflow: hidden; 
            display: flex; 
            flex-direction: column; 
            justify-content: space-between;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.6);
        }

        .card img { 
            width: 100%; 
            height: 90px; 
            object-fit: cover; 
            background: #1a1c23;
        }

        .card-body { 
            padding: 6px; 
            display: flex; 
            flex-direction: column; 
            justify-content: space-between; 
            flex: 1; 
        }

        .card-title { 
            font-size: 10px; 
            font-weight: 600; 
            line-height: 1.2; 
            height: 24px; 
            overflow: hidden; 
            margin-bottom: 6px;
            color: #d1d5db;
        }

        /* Glowing Gold Unlock Button */
        .unlock-btn { 
            width: 100%; 
            padding: 6px 0; 
            border: 1px solid rgba(234, 179, 8, 0.4); 
            border-radius: 5px; 
            background: linear-gradient(180deg, #1f1a00 0%, #0a0800 100%); 
            color: var(--gold-accent); 
            font-weight: 800; 
            cursor: pointer; 
            font-size: 9px; 
            letter-spacing: 0.3px;
            text-transform: uppercase;
            text-shadow: 0 0 6px rgba(234, 179, 8, 0.8);
            box-shadow: 0 0 8px rgba(234, 179, 8, 0.2);
            transition: all 0.2s ease;
        }

        .unlock-btn:active { 
            transform: scale(0.95);
            box-shadow: 0 0 12px rgba(234, 179, 8, 0.5);
        }

        .status-msg {
            text-align: center;
            grid-column: span 3;
            padding: 30px 0;
            color: #a0aec0;
            font-size: 12px;
        }
    </style>
</head>
<body>

    <!-- Top Header -->
    <div class="top-bar">
        <h1 class="header-title">✨ VIP CONTENT VAULT</h1>
        <button class="vip-pill-btn" onclick="buyVipPass()">
            👑 Get VIP (0 Ads)
        </button>
    </div>

    <!-- Zero Ads Experience Card (Exact style from reference player) -->
    <div class="zero-ads-card" onclick="buyVipPass()">
        <div class="zero-ads-left">
            <div class="icon-box">⚡</div>
            <div class="zero-ads-text">
                <span class="zero-ads-title">Zero Ads Experience</span>
                <span class="zero-ads-sub">Bypass all ads & stream instantly for 3 Mo ₹399</span>
            </div>
        </div>
        <div class="zero-ads-arrow">›</div>
    </div>

    <!-- 3 Column Catalog Grid -->
    <div class="grid" id="catalog">
        <div class="status-msg">⚡ Loading VIP Catalog...</div>
    </div>

    <script>
        const API_URL = "https://media-vault-backend.onrender.com"; 

        async function fetchWithRetry(url, retries = 3, delay = 2000) {
            for (let i = 0; i < retries; i++) {
                try {
                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), 15000);
                    
                    const res = await fetch(url, { signal: controller.signal });
                    clearTimeout(timeoutId);
                    
                    if (res.ok) return await res.json();
                } catch (err) {
                    if (i < retries - 1) await new Promise(r => setTimeout(r, delay));
                }
            }
            throw new Error("Server timeout");
        }

        async function loadCatalog() {
            const container = document.getElementById('catalog');
            try {
                const videos = await fetchWithRetry(`${API_URL}/api/videos`);
                
                if (!videos || videos.length === 0) {
                    container.innerHTML = `<div class="status-msg">No media available at the moment.</div>`;
                    return;
                }

                container.innerHTML = videos.map(v => `
                    <div class="card">
                        <img src="${v.thumbnail}" alt="thumb" onerror="this.src='https://picsum.photos/300/200'" />
                        <div class="card-body">
                            <div class="card-title">${v.title}</div>
                            <button class="unlock-btn" onclick="unlockContent('${v.targetUrl}')">
                                ▶ UNLOCK
                            </button>
                        </div>
                    </div>
                `).join('');
            } catch (err) {
                container.innerHTML = `
                    <div class="status-msg">
                        Server connection delayed.<br><br>
                        <button class="unlock-btn" style="width: auto; padding: 6px 16px;" onclick="loadCatalog()">
                            🔄 Tap to Retry
                        </button>
                    </div>
                `;
            }
        }

        function unlockContent(destination) {
            if (window.Telegram && window.Telegram.WebApp) {
                window.Telegram.WebApp.openLink(destination);
            } else {
                window.location.href = destination;
            }
        }

        function buyVipPass() {
            alert("👑 Zero Ads VIP Pass\n\nBypass all ads & stream instantly for 3 Months (₹399).\n\nRedirecting to payment gateway...");
        }

        loadCatalog();
    </script>
</body>
</html>
