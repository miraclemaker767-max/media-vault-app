<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIP Content Vault</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
    <style>
        :root {
            --bg-dark: #0a0b0e;
            --card-bg: #14161d;
            --gold-primary: #ffd700;
            --gold-gradient: linear-gradient(180deg, #fff2a3 0%, #ffd700 50%, #cca100 100%);
        }

        body { 
            background-color: var(--bg-dark); 
            color: #e2e8f0; 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
            padding: 10px; 
            margin: 0; 
            box-sizing: border-box;
        }

        /* Top Bar Layout */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(255, 215, 0, 0.15);
        }

        /* Metallic Gold Title */
        .header-title {
            font-size: 16px;
            font-weight: 900;
            letter-spacing: 1px;
            text-transform: uppercase;
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0;
            filter: drop-shadow(0 0 8px rgba(255, 215, 0, 0.3));
        }

        /* Compact Top-Right "No Ads" Badge */
        .no-ads-badge {
            background: linear-gradient(135deg, #1f1a00, #3d3200);
            border: 1px solid var(--gold-primary);
            color: var(--gold-primary);
            font-weight: 800;
            font-size: 9px;
            padding: 5px 8px;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 0 8px rgba(255, 215, 0, 0.3);
            text-transform: uppercase;
            white-space: nowrap;
        }
        .no-ads-badge:active {
            transform: scale(0.95);
        }

        /* 3-Column Grid Layout */
        .grid { 
            display: grid; 
            grid-template-columns: repeat(3, 1fr); 
            gap: 8px; 
        }

        .card { 
            background: var(--card-bg); 
            border-radius: 8px; 
            overflow: hidden; 
            display: flex; 
            flex-direction: column; 
            justify-content: space-between;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.6);
        }

        .card img { 
            width: 100%; 
            height: 90px; 
            object-fit: cover; 
            background: #1a1c23;
        }

        .card-body { 
            padding: 6px; 
            display: flex; 
            flex-direction: column; 
            justify-content: space-between; 
            flex: 1; 
        }

        .card-title { 
            font-size: 10px; 
            font-weight: 600; 
            line-height: 1.2; 
            height: 24px; 
            overflow: hidden; 
            margin-bottom: 6px;
            color: #d1d5db;
        }

        /* Glowing Gold Button */
        .unlock-btn { 
            width: 100%; 
            padding: 6px 0; 
            border: 1px solid rgba(255, 215, 0, 0.4); 
            border-radius: 5px; 
            background: linear-gradient(180deg, #1f1a00 0%, #0a0800 100%); 
            color: var(--gold-primary); 
            font-weight: 800; 
            cursor: pointer; 
            font-size: 9px; 
            letter-spacing: 0.3px;
            text-transform: uppercase;
            text-shadow: 0 0 6px rgba(255, 215, 0, 0.8);
            box-shadow: 0 0 8px rgba(255, 215, 0, 0.2);
            transition: all 0.2s ease;
        }

        .unlock-btn:active { 
            transform: scale(0.95);
            box-shadow: 0 0 12px rgba(255, 215, 0, 0.5);
        }

        .status-msg {
            text-align: center;
            grid-column: span 3;
            padding: 20px 0;
            color: #a0aec0;
            font-size: 12px;
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <h1 class="header-title">✨ VIP VAULT</h1>
        <button class="no-ads-badge" onclick="buyVipPass()">
            👑 NO ADS | ₹399
        </button>
    </div>

    <div class="grid" id="catalog">
        <div class="status-msg">Loading VIP items...</div>
    </div>

    <script>
        const API_URL = "https://media-vault-backend.onrender.com"; 

        async function loadCatalog() {
            const container = document.getElementById('catalog');
            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 6000); // 6s timeout

                const res = await fetch(`${API_URL}/api/videos`, { signal: controller.signal });
                clearTimeout(timeoutId);
                
                const videos = await res.json();
                
                if (!videos || videos.length === 0) {
                    container.innerHTML = `<div class="status-msg">No media available at the moment.</div>`;
                    return;
                }

                container.innerHTML = videos.map(v => `
                    <div class="card">
                        <img src="${v.thumbnail}" alt="thumb" onerror="this.src='https://picsum.photos/300/200'" />
                        <div class="card-body">
                            <div class="card-title">${v.title}</div>
                            <button class="unlock-btn" onclick="unlockContent('${v.targetUrl}')">
                                ▶ UNLOCK
                            </button>
                        </div>
                    </div>
                `).join('');
            } catch (err) {
                console.error("Error loading videos:", err);
                container.innerHTML = `<div class="status-msg">Connecting to server... Please refresh in a moment.</div>`;
            }
        }

        function unlockContent(destination) {
            if (window.Telegram && window.Telegram.WebApp) {
                window.Telegram.WebApp.openLink(destination);
            } else {
                window.location.href = destination;
            }
        }

        function buyVipPass() {
            alert("VIP Pass (No Ads for 3 Months - ₹399)\n\nRedirecting to payment...");
        }

        loadCatalog();
    </script>
</body>
</html>
