<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✨ VIP CONTENT VAULT</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
    <style>
        :root {
            --bg-dark: #0a0b0e;
            --card-bg: #14161d;
            --gold-primary: #ffd700;
            --gold-gradient: linear-gradient(180deg, #fff2a3 0%, #ffd700 50%, #cca100 100%);
        }

        body { 
            background-color: var(--bg-dark); 
            color: #e2e8f0; 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
            padding: 10px; 
            margin: 0; 
            box-sizing: border-box;
        }

        /* Full Centered Title */
        .header {
            text-align: center;
            margin: 8px 0 12px 0;
        }

        .header h1 {
            font-size: 18px;
            font-weight: 900;
            letter-spacing: 1px;
            text-transform: uppercase;
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0;
            filter: drop-shadow(0 0 10px rgba(255, 215, 0, 0.4));
        }

        /* Prominent Glowing "NO ADS" Button */
        .no-ads-container {
            display: flex;
            justify-content: center;
            margin-bottom: 14px;
        }

        .no-ads-btn {
            background: linear-gradient(135deg, #2b2300 0%, #524200 50%, #2b2300 100%);
            border: 1.5px solid var(--gold-primary);
            color: var(--gold-primary);
            font-weight: 800;
            font-size: 11px;
            padding: 8px 18px;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 0 12px rgba(255, 215, 0, 0.45);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            text-shadow: 0 0 6px rgba(255, 215, 0, 0.8);
            transition: all 0.2s ease;
        }

        .no-ads-btn:active {
            transform: scale(0.96);
            box-shadow: 0 0 18px rgba(255, 215, 0, 0.7);
        }

        /* 3-Column Grid */
        .grid { 
            display: grid; 
            grid-template-columns: repeat(3, 1fr); 
            gap: 8px; 
        }

        .card { 
            background: var(--card-bg); 
            border-radius: 8px; 
            overflow: hidden; 
            display: flex; 
            flex-direction: column; 
            justify-content: space-between;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.6);
        }

        .card img { 
            width: 100%; 
            height: 90px; 
            object-fit: cover; 
            background: #1a1c23;
        }

        .card-body { 
            padding: 6px; 
            display: flex; 
            flex-direction: column; 
            justify-content: space-between; 
            flex: 1; 
        }

        .card-title { 
            font-size: 10px; 
            font-weight: 600; 
            line-height: 1.2; 
            height: 24px; 
            overflow: hidden; 
            margin-bottom: 6px;
            color: #d1d5db;
        }

        /* Glowing Gold Unlock Button */
        .unlock-btn { 
            width: 100%; 
            padding: 6px 0; 
            border: 1px solid rgba(255, 215, 0, 0.4); 
            border-radius: 5px; 
            background: linear-gradient(180deg, #1f1a00 0%, #0a0800 100%); 
            color: var(--gold-primary); 
            font-weight: 800; 
            cursor: pointer; 
            font-size: 9px; 
            letter-spacing: 0.3px;
            text-transform: uppercase;
            text-shadow: 0 0 6px rgba(255, 215, 0, 0.8);
            box-shadow: 0 0 8px rgba(255, 215, 0, 0.2);
            transition: all 0.2s ease;
        }

        .unlock-btn:active { 
            transform: scale(0.95);
            box-shadow: 0 0 12px rgba(255, 215, 0, 0.5);
        }

        .status-msg {
            text-align: center;
            grid-column: span 3;
            padding: 30px 0;
            color: #a0aec0;
            font-size: 12px;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>✨ VIP CONTENT VAULT</h1>
    </div>

    <div class="no-ads-container">
        <button class="no-ads-btn" onclick="buyVipPass()">
            👑 REMOVE ADS | 3 MONTHS - ₹399
        </button>
    </div>

    <div class="grid" id="catalog">
        <div class="status-msg">⚡ Waking up server & loading catalog...</div>
    </div>

    <script>
        const API_URL = "https://media-vault-backend.onrender.com"; 

        async function fetchWithRetry(url, retries = 3, delay = 2000) {
            for (let i = 0; i < retries; i++) {
                try {
                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), 15000); // 15s timeout
                    
                    const res = await fetch(url, { signal: controller.signal });
                    clearTimeout(timeoutId);
                    
                    if (res.ok) return await res.json();
                } catch (err) {
                    console.log(`Attempt ${i + 1} failed, retrying in ${delay}ms...`);
                    if (i < retries - 1) await new Promise(r => setTimeout(r, delay));
                }
            }
            throw new Error("Server timeout");
        }

        async function loadCatalog() {
            const container = document.getElementById('catalog');
            try {
                const videos = await fetchWithRetry(`${API_URL}/api/videos`);
                
                if (!videos || videos.length === 0) {
                    container.innerHTML = `<div class="status-msg">No media available at the moment.</div>`;
                    return;
                }

                container.innerHTML = videos.map(v => `
                    <div class="card">
                        <img src="${v.thumbnail}" alt="thumb" onerror="this.src='https://picsum.photos/300/200'" />
                        <div class="card-body">
                            <div class="card-title">${v.title}</div>
                            <button class="unlock-btn" onclick="unlockContent('${v.targetUrl}')">
                                ▶ UNLOCK
                            </button>
                        </div>
                    </div>
                `).join('');
            } catch (err) {
                container.innerHTML = `
                    <div class="status-msg">
                        Server is taking longer to respond.<br><br>
                        <button class="unlock-btn" style="width: auto; padding: 6px 16px;" onclick="loadCatalog()">
                            🔄 Tap to Retry
                        </button>
                    </div>
                `;
            }
        }

        function unlockContent(destination) {
            if (window.Telegram && window.Telegram.WebApp) {
                window.Telegram.WebApp.openLink(destination);
            } else {
                window.location.href = destination;
            }
        }

        function buyVipPass() {
            alert("👑 REMOVE ADS PASS\n\nGet 3 Months Unlimited Access for ₹399.\n\nRedirecting to payment gateway...");
        }

        loadCatalog();
    </script>
</body>
</html>
